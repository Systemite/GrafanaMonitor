global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Host metrics are pushed in by the native Alloy agent via remote_write
# (--web.enable-remote-write-receiver is set in docker-compose), so no host
# scrape job is required here. Prometheus scrapes only itself for self-health.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
