services:
  loki:
    image: grafana/loki:3.5
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks: [monitoring]

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345" # Alloy UI for debugging the pipeline
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # IMPORTANT: mount the DIRECTORY containing the CSV/DLQ, never the file itself.
      # Using the local ./data folder; drop your CSV/DLQ in there as data/metrics.dlq.
      - ./data:/logs:ro
    depends_on: [loki]
    networks: [monitoring]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true # local dev convenience; remove for prod
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro # provisioned dashboard JSON
      - grafana-data:/var/lib/grafana
    depends_on: [loki]
    networks: [monitoring]

volumes:
  loki-data:
  alloy-data:
  grafana-data:

networks:
  monitoring:
