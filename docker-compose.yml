services:
  loki:
    image: grafana/loki:3.5
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks: [monitoring]

  # NOTE: Alloy runs as a NATIVE Windows service on
  # the monitored host so it can tail the local .dlq files and read true Windows
  # host metrics (CPU/RAM/disk/swap) via its built-in prometheus.exporter.windows.
  # See README and alloy/config.alloy. It talks to the services below over
  # published localhost ports.

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Let native Alloy push metrics in via remote_write.
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [monitoring]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true # local dev convenience; remove for prod
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro # provisioned dashboard JSON
      - grafana-data:/var/lib/grafana
    depends_on: [loki, prometheus]
    networks: [monitoring]

volumes:
  loki-data:
  prometheus-data:
  grafana-data:

networks:
  monitoring:
